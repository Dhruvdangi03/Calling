plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

// TURN/STUN config comes from local.properties (gitignored) so credentials for the self-hosted
// coturn server never get committed. Falls back to STUN-only if TURN fields are left blank,
// which keeps a fresh checkout compiling and runnable (same-network calls still work via STUN).
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def localProp = { key, fallback -> localProps.getProperty(key, fallback) }

android {
    namespace 'com.ddangi.calling'
    compileSdk 35

    defaultConfig {
        applicationId "com.ddangi.calling"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"

        buildConfigField "String", "STUN_URL", "\"${localProp('STUN_URL', 'stun:stun.l.google.com:19302')}\""
        buildConfigField "String", "TURN_URL_UDP", "\"${localProp('TURN_URL_UDP', '')}\""
        buildConfigField "String", "TURN_URL_TCP", "\"${localProp('TURN_URL_TCP', '')}\""
        buildConfigField "String", "TURN_USERNAME", "\"${localProp('TURN_USERNAME', '')}\""
        buildConfigField "String", "TURN_CREDENTIAL", "\"${localProp('TURN_CREDENTIAL', '')}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.17.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.7'
    implementation 'androidx.core:core:1.15.0'

    implementation 'io.getstream:stream-webrtc-android:1.3.9'
}
